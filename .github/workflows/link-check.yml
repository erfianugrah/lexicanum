# External link rot, on a schedule rather than on commit.
#
# `verify:docs:links` is deliberately kept out of `bun run build`: someone
# else's 503 is not a defect in this repo, and a flaky vendor host must not be
# able to block a deploy. The cost of that choice is that a moved vendor page
# rots silently - a citation supporting the load-bearing claim in the tenancy
# reference 404'd for an unknown period because nothing ever ran this check.
#
# So it runs weekly instead, and files an issue when it fails. A red cron with
# no issue is a notification nobody reads.
name: Link check

on:
  schedule:
    # Mondays 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: "link-check"
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v1

      - name: Install project dependencies
        run: bun install

      # Source-only: this check reads src/content/docs, so it needs neither a
      # build nor the D2 CLI nor BANNED_IDENTIFIERS.
      - name: Check external links
        id: links
        run: bun run verify:docs:links 2>&1 | tee /tmp/links.log

      - name: File or update an issue when links are dead
        if: failure() && steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Dead external links in the docs corpus"
        run: |
          set -euo pipefail
          # Only the assertion diff matters; the rest is bun test chrome.
          body=$(
            printf '`bun run verify:docs:links` failed on %s.\n\n```\n' "$(date -u +%Y-%m-%d)"
            grep -oE '"([0-9]{3}|no response) [^"]+"' /tmp/links.log | head -50 || tail -40 /tmp/links.log
            printf '```\n\n[Run](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          )
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
