name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # Cache Bun dependencies
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-bun-

      # Cache D2 CLI
      - name: Cache D2 CLI
        uses: actions/cache@v6
        id: d2-cache
        with:
          path: ~/.local
          key: ${{ runner.os }}-d2-v0.7.1
          restore-keys: |
            ${{ runner.os }}-d2-

      # Cache Astro build
      - name: Cache Astro build
        uses: actions/cache@v6
        with:
          path: |
            .astro
            dist
          key: ${{ runner.os }}-astro-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - name: Install project dependencies
        run: bun install

      - name: Install D2 CLI for diagram rendering
        if: steps.d2-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://d2lang.com/install.sh | sh

      - name: Build project with retry
        env:
          MAX_ATTEMPTS: 3
          RETRY_INTERVAL: 30
          # The doc test suite runs inside `bun run build`, and its identifier
          # hygiene check FAILS when this is unset rather than skipping.
          BANNED_IDENTIFIERS: ${{ secrets.BANNED_IDENTIFIERS }}
          PATH: ${{ github.workspace }}/.local/bin:~/.local/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          # Ensure D2 is in PATH
          export PATH="$HOME/.local/bin:$PATH"

          # Verify D2 is available
          d2 --version || { echo "D2 CLI not found"; exit 1; }

          attempt=1
          until bun run build || [ $attempt -eq $MAX_ATTEMPTS ]; do
            echo "Build attempt $attempt failed. Retrying in $RETRY_INTERVAL seconds..."
            sleep $RETRY_INTERVAL
            attempt=$((attempt + 1))
          done

          if [ $attempt -eq $MAX_ATTEMPTS ] && ! bun run build; then
            echo "Build failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      # Deploy steps were merged from the deploy-to-cloudflare-workers job
      # (upload/download-artifact does not work on the Forgejo runner); they
      # carry the original job's condition.
      # wrangler-action v4 installs the latest Wrangler when wranglerVersion is
      # unset, which is what we want - do not pin it here. v3 defaulted to
      # Wrangler v3; that was this bump's only breaking change, and it is a
      # no-op for us because package.json already tracks wrangler ^4.
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WRANGLER_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: bun

      # The Workers assets platform serves HTML from a per-PoP cache even at
      # max-age=0,must-revalidate; without a purge some PoPs serve the previous
      # deploy for tens of minutes. Warn-only if the token lacks cache-purge
      # perms - the deploy itself has already succeeded.
      - name: Purge zone cache
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: bun scripts/purge-cache.ts
        env:
          # CLOUDFLARE_WRANGLER_TOKEN lacks Zone:Cache Purge (warns and
          # skips). Set CLOUDFLARE_PURGE_TOKEN (Zone:Cache Purge on
          # erfi.dev) or the global key pair to make this fire.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN || secrets.CLOUDFLARE_WRANGLER_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}

  purge-cloudflare-cache:
    needs: [build-and-deploy]
    if: always() && needs.build-and-deploy.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["erfi.dev"]}'
